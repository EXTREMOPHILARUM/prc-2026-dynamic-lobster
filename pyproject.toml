[project]
name = "prc-data-challenge"
version = "0.1.0"
description = "PRC Data Challenge 2026 - taxi-out time prediction (team dynamic-lobster)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.3", "jupyterlab>=4.2", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]

[tool.ruff]
line-length = 100
